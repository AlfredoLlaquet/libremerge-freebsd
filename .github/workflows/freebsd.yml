# LM4BSD BEGIN ADDITION
name: FreeBSD

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    name: Build and test on FreeBSD ${{ matrix.release }} amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
          - { release: '14.4', major: '14' }
          - { release: '15.1', major: '15' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        with:
          release: ${{ matrix.release }}
          sync: rsync
          envs: GITHUB_SHA
          prepare: |
            pkg install -y git cmake qt6-base qt6-svg qt6-imageformats qt6-translations \
              poco boost-libs icu re2c lemon googletest python3
          run: sh packaging/freebsd/build-packages.sh
      - name: Record the build system
        run: |
          echo "Built and tested on $(cat out/userland.txt) (amd64), running kernel $(cat out/kernel.txt)." | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-FreeBSD-${{ matrix.major }}-amd64
          path: out/
          compression-level: 0
          if-no-files-found: error

  install:
    name: Clean install and upgrade on FreeBSD ${{ matrix.release }} amd64
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { release: '14.4', major: '14' }
          - { release: '14.5', major: '14' }
          - { release: '15.1', major: '15' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-FreeBSD-${{ matrix.major }}-amd64
          path: packages
      - uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        with:
          release: ${{ matrix.release }}
          sync: rsync
          run: |
            set -eu
            sh packaging/freebsd/check-package.sh
            freebsd-version -u > tested-userland.txt
            freebsd-version -r > tested-kernel.txt
      - name: Record the installed package test
        run: |
          echo "Fresh installation and upgrade passed on $(cat tested-userland.txt) (amd64), running kernel $(cat tested-kernel.txt)." | tee -a "$GITHUB_STEP_SUMMARY"

  downloads:
    name: Assemble tested downloads
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-FreeBSD-*-amd64
          path: builds
      - name: Collect both packages and their corresponding source
        run: |
          mkdir release
          cp builds/build-FreeBSD-14-amd64/release/*-FreeBSD-14-amd64.pkg release/
          cp builds/build-FreeBSD-15-amd64/release/*-FreeBSD-15-amd64.pkg release/
          cp builds/build-FreeBSD-15-amd64/release/*-source.tar.gz release/
          cd release
          sha256sum *.pkg *-source.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Offer the standalone FreeBSD 14 package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: release/*-FreeBSD-14-amd64.pkg
          archive: false
          if-no-files-found: error
      - name: Offer the standalone FreeBSD 15 package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: release/*-FreeBSD-15-amd64.pkg
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libremerge-FreeBSD-amd64
          path: release/
          compression-level: 0
          if-no-files-found: error
# LM4BSD END
